name: MLOD-0B transient event matrix
on:
  workflow_dispatch:
  push:
    branches: [feat/mlod-0b-shadow-census]
permissions:
  contents: read
jobs:
  event-matrix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mlod0b-events]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: seed-20260914, seed: 20260914 }
          - { id: seed-73101, seed: 73101 }
          - { id: seed-61003, seed: 61003 }
          - { id: age-100-dt01, age: 100, dt: 0.1 }
          - { id: age-100-dt1, age: 100, dt: 1 }
          - { id: age-100-dt3, age: 100, dt: 3 }
          - { id: age-400-dt01, age: 400, dt: 0.1 }
          - { id: age-400-dt1, age: 400, dt: 1 }
          - { id: age-400-dt3, age: 400, dt: 3 }
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - if: matrix.seed
        run: node scripts/inkbox-mlod0b-event-matrix.mjs --seed=${{ matrix.seed }} --years=200 --dt=3 --out=reports/mlod0b/event-matrix/${{ matrix.id }}.json
      - if: matrix.age
        run: node scripts/inkbox-mlod0b-event-matrix.mjs --age=${{ matrix.age }} --days=360 --dt=${{ matrix.dt }} --out=reports/mlod0b/event-matrix/${{ matrix.id }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlod0b-events-${{ matrix.id }}
          path: reports/mlod0b/event-matrix/${{ matrix.id }}.json
          if-no-files-found: error
