name: Inkbox Nightly

# ─────────────────────────────────────────────────────────────────────────
# 长测（M1.1D D3.5）
# ─────────────────────────────────────────────────────────────────────────
#
# 这两条**不得**进 `ci.yml`：它们慢到会把每次 push 的门禁拖成几十分钟，
# 而它们要守的东西（长时段生态不坏死）本来就该按「天」的粒度看。
#
#   · `npm run test:simulation` —— smoke，6.5–13 分钟
#   · `npm run inkbox:longrun`  —— 800 年长跑体检
#
# ⚠️ 注意脚本名：**没有** `test:longrun` 这个入口，长跑脚本叫 `inkbox:longrun`。
# ⚠️ 与 ci.yml 同一套铁律：不删测试、不加 `|| true`、不把 assertion 降级成 warning。
#
# 手动触发：Actions → Inkbox Nightly → Run workflow。

on:
  schedule:
    # 每天 18:00 UTC（= 次日 02:00 北京时间），避开白天开发高峰。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: 长测（smoke + 800 年长跑）
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 世界推进长时段体检（800 年）
        run: npm run inkbox:longrun

      - name: 旧 smoke 全量检查（6.5–13 分钟）
        run: npm run test:simulation
