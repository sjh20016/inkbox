<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>坐天观井 · 面相工坊 G2-P</title>
<link rel="stylesheet" href="../../src/inkbox/ui/g2/portraits/characterPortrait.css">
<link rel="stylesheet" href="../../src/inkbox/ui/g2/portraits/v2/portraitV2.css">
<link rel="stylesheet" href="./portraitWorkbench.css">
</head>
<body><main class="g2p">
<header class="g2p__mast">
<div><p class="g2p__kicker">INKBOX / PORTRAIT ATELIER / v1</p><h1>众生有相</h1>
<p>面相引擎 · 程序占位素材 · 手绘替换工坊</p></div>
<div class="g2p__seal">此处皆为演示数据<br>不写入模拟与存档</div>
</header>
<nav class="g2p__tabs" aria-label="预览场景">
<button data-tab="gallery" aria-current="page">众生六十四相</button>
<button data-tab="family">三代家谱</button>
<button data-tab="states">同人异相</button>
<button data-tab="painting">手绘图层试装</button>
</nav>
<section class="g2p__board">
<div class="g2p__toolbar" id="tools"></div>
<div id="output" class="g2p__output" aria-live="polite"></div>
<aside class="g2p__inspector"><h2>面相槽位清单</h2>
<div id="inspector" class="g2p__inspector-content">点击头像查看槽位。</div>
<p class="g2p__muted">绘画母版 1024×1024；透明 PNG 导出 512×512，完整画布不裁边。</p></aside>
</section><footer class="g2p__foot">
<p>所有人物、亲缘、伤势与功法皆为 fixture，演示不代表真实游戏人物状态。</p>
<p>独立纯前端预览，不消耗模拟 RNG，不依赖 CDN 与在线图片。</p>
</footer></main>
<script type="module" src="./portraitWorkbench.js"></script></body></html>
