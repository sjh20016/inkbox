<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>坐天观井 · 实验建筑资产 · 查看器</title>
<style>
  html,body{margin:0;height:100%;background:#e9e0cd;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  #hud{position:fixed;left:14px;top:12px;z-index:10;color:#22201c;font-size:13px;
    line-height:1.75;background:rgba(244,239,226,.84);padding:11px 15px;
    border:1px solid #7d776b;max-width:340px}
  #hud b{font-size:15px}
  #hud small{color:#4a463e}
  code{background:rgba(125,119,107,.16);padding:0 3px}
  #hint{position:fixed;right:14px;bottom:12px;z-index:10;color:#4a463e;font-size:12px}
</style>
</head>
<body>
<div id="hud">
  <b>坐天观井 · 实验建筑资产</b><br>
  <small>共享图集 <code>Inkbox_EntityAtlas.png</code> · UV 取色 · 平直法线<br>
  纸白墙 + 墨屋顶 + 极少木色 · 拖拽旋转 / 滚轮缩放<br>
  五组：建筑 · 地形岩体 · 宗门宅院 · 废址遗存 · 特殊地形</small>
</div>
<div id="hint">procedural · Blender headless · GLB</div>

<script type="importmap">
{"imports":{"three":"./../../vendor/three/build/three.module.js",
            "three/addons/":"./../../vendor/three/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── 极简自包含 GLB 解析器（无需 GLTFLoader） ──────────────────
const COMP = { 5126: Float32Array, 5123: Uint16Array, 5125: Uint32Array };
const NCOMP = { SCALAR: 1, VEC2: 2, VEC3: 3 };

async function loadGLB(url) {
  const buf = await (await fetch(encodeURI(url))).arrayBuffer();
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('not glb: ' + url);
  let off = 12, json = null, bin = null;
  while (off < dv.byteLength) {
    const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
    const start = off + 8;
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, start, len)));
    else if (type === 0x004E4942) bin = new Uint8Array(buf, start, len);
    off = start + len;
  }
  const acc = (i) => {
    const a = json.accessors[i], bv = json.bufferViews[a.bufferView];
    const T = COMP[a.componentType], n = NCOMP[a.type];
    const bo = (bv.byteOffset || 0) + (a.byteOffset || 0);
    return new T(bin.buffer, bin.byteOffset + bo, a.count * n);
  };

  const prim = json.meshes[0].primitives[0];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(acc(prim.attributes.POSITION), 3));
  if (prim.attributes.NORMAL !== undefined)
    g.setAttribute('normal', new THREE.BufferAttribute(acc(prim.attributes.NORMAL), 3));
  if (prim.attributes.TEXCOORD_0 !== undefined)
    g.setAttribute('uv', new THREE.BufferAttribute(acc(prim.attributes.TEXCOORD_0), 2));
  // glTF 图元通常是「带索引」的：必须挂 index，否则会把顶点当成独立三角形，退化成点云
  let triCount;
  if (prim.indices !== undefined) {
    const ia = acc(prim.indices);
    g.setIndex(new THREE.BufferAttribute(ia, 1));
    triCount = ia.length / 3;
  } else {
    triCount = acc(prim.attributes.POSITION).length / 3;
  }

  const ibv = json.bufferViews[json.images[0].bufferView];
  const ioff = ibv.byteOffset || 0;          // Blender 在 offset=0 时会省略该字段
  const blob = new Blob([bin.slice(ioff, ioff + ibv.byteLength)], { type: 'image/png' });
  const tex = await new THREE.TextureLoader().loadAsync(URL.createObjectURL(blob));
  tex.flipY = false;                         // glTF UV 原点在左上；Three 默认 flipY=true 会上下翻转
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;

  const mat = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide });
  return { mesh: new THREE.Mesh(g, mat), tris: triCount };
}

function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.font = '30px "Microsoft YaHei",sans-serif';
  x.fillStyle = '#22201c'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 128, 34);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(0.88, 0.22, 1);
  return s;
}

// ── 场景 ─────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xe9e0cd, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xf7f2e6, 0xc6b89e, 1.25));
const sun = new THREE.DirectionalLight(0xfff6e4, 1.45);
sun.position.set(4.5, 8, 6); scene.add(sun);
const fill = new THREE.DirectionalLight(0xdce6ee, 0.45);
fill.position.set(-6, 3.5, -4.5); scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshLambertMaterial({ color: 0xded3ba })
);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02;
scene.add(ground);

// ── 资产网格排布 ──────────────────────────────────────────────
const GROUPS = [
  { dir: '建筑', items: ['bld_house', 'bld_hall', 'bld_tower', 'bld_gate',
                          'bld_wall', 'bld_ruin', 'bld_altar', 'bld_bridge'] },
  { dir: '地形', items: ['terr_cave', 'terr_arch', 'terr_pillar', 'terr_cliff',
                          'terr_rock', 'terr_terrace', 'terr_stairs', 'terr_slab'] },
  { dir: '宗门宅院', items: ['bld_manor', 'bld_dorm', 'bld_alchemy', 'bld_scripture',
                          'bld_forge', 'bld_beastpen', 'bld_hut'] },
  { dir: '废址', items: ['bld_sectruin', 'bld_relic'] },
  { dir: '特殊地形', items: ['terr_spiritfield', 'terr_ancientroad', 'terr_mountainpath',
                          'terr_plankwalk', 'terr_spring', 'terr_blast', 'terr_battlefield',
                          'terr_array', 'terr_lair', 'terr_immortalcave'] },
];
const CN = {
  bld_house: '民居', bld_hall: '宗祠', bld_tower: '望楼', bld_gate: '牌坊',
  bld_wall: '垣墙', bld_ruin: '残垣', bld_altar: '祭坛', bld_bridge: '拱桥',
  terr_cave: '洞府入口', terr_arch: '天然石门', terr_pillar: '石林', terr_cliff: '断崖',
  terr_rock: '岩壁块', terr_terrace: '层台', terr_stairs: '石阶', terr_slab: '石台',
  bld_manor: '富户宅院', bld_dorm: '弟子房', bld_alchemy: '丹房', bld_scripture: '藏经阁',
  bld_forge: '炼器房', bld_beastpen: '灵兽棚', bld_hut: '草庐',
  bld_sectruin: '废弃宗门', bld_relic: '废墟古迹',
  terr_spiritfield: '灵田', terr_ancientroad: '古道', terr_mountainpath: '山道',
  terr_plankwalk: '栈桥', terr_spring: '灵泉', terr_blast: '雷击地',
  terr_battlefield: '古战场', terr_array: '古阵遗址', terr_lair: '妖兽巢穴',
  terr_immortalcave: '仙人洞府',
};

const STEP = 2.0, COLS = 8;
// 行数动态累计：组大小不等时不会互相压叠
const ROWS = GROUPS.reduce((s, g) => s + Math.ceil(g.items.length / COLS), 0);
let total = 0, tris = 0;
const root = new THREE.Group(); scene.add(root);

let rowCursor = 0;
for (const grp of GROUPS) {
  for (let i = 0; i < grp.items.length; i++) {
    const name = grp.items[i];
    const col = i % COLS, row = rowCursor + Math.floor(i / COLS);
    const x = (col - (COLS - 1) / 2) * STEP;
    const z = (row - (ROWS - 1) / 2) * STEP;
    try {
      const { mesh, tris: t } = await loadGLB(`${grp.dir}/${name}.glb`);
      mesh.position.set(x, 0, z);
      root.add(mesh);
      const lb = makeLabel(`${CN[name]} ${name.split('_')[1]}`);
      lb.position.set(x, 2.45, z);
      root.add(lb);
      total++; tris += t;
    } catch (e) { console.error(name, e); }
  }
  rowCursor += Math.ceil(grp.items.length / COLS);
}
document.getElementById('hint').textContent =
  `${total} 件资产 · ${tris} 三角形 · Blender headless GLB`;

// 按实际包围盒自动取景：逐角点求「该角点刚好入画」所需的最小相机距离，取最大者。
// （分别取水平/垂直最大值再相加会明显过估——本资产集是扁平的网格排布。）
const bbox = new THREE.Box3();
root.traverse(o => {
  if ((o.isMesh && o.material && o.material.map) || o.isSprite) bbox.expandByObject(o);
});
const center = bbox.getCenter(new THREE.Vector3());

const dir = new THREE.Vector3(0.26, 0.70, 0.66).normalize();   // 由中心指向相机（俯角约 46°，弱侧偏）
const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
const camUp = new THREE.Vector3().crossVectors(right, dir).normalize();
const halfFovY = THREE.MathUtils.degToRad(camera.fov * 0.5);
const halfFovX = Math.atan(Math.tan(halfFovY) * camera.aspect);
const tanX = Math.tan(halfFovX), tanY = Math.tan(halfFovY);

let dist = 0;
const d = new THREE.Vector3();
for (const sx of [bbox.min.x, bbox.max.x])
  for (const sy of [bbox.min.y, bbox.max.y])
    for (const sz of [bbox.min.z, bbox.max.z]) {
      d.set(sx, sy, sz).sub(center);
      // 角点相对相机位于 d·dir 处；需 dist - d·dir 的深度才能容下它的横向/纵向偏移
      const need = Math.max(Math.abs(d.dot(right)) / tanX,
                            Math.abs(d.dot(camUp)) / tanY) + d.dot(dir);
      dist = Math.max(dist, need);
    }
camera.position.copy(center).addScaledVector(dir, dist * 1.04);
controls.target.copy(center);
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
window.__scene = scene;
window.__camera = camera;
window.__controls = controls;
window.__ready = true;
</script>
</body>
</html>
