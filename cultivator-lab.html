<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>坐天观井 · 修士资产尺度验收</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#d5d8dc;color:#28303b;font-family:system-ui,"Microsoft YaHei",sans-serif}
    header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#f0eeea;border-bottom:1px solid #b6b9bc}
    h1{font-size:22px;margin:0 0 4px;letter-spacing:.08em}header p{font-size:13px;margin:0;color:#626973}
    nav{display:flex;gap:8px}button{font:inherit;padding:9px 14px;background:#e1e2df;border:1px solid #a3adb6;border-radius:4px;cursor:pointer}
    button[aria-pressed=true]{background:#354b5e;color:#fff;border-color:#354b5e}
    main{height:calc(100vh - 136px);position:relative}canvas{display:block;width:100%;height:100%}
    #status{position:absolute;left:28px;top:18px;background:#f5f3eedc;padding:10px 14px;border-radius:4px;font-size:13px;line-height:1.7;pointer-events:none;white-space:pre-line}
    #labels{position:absolute;inset:0;pointer-events:none}.role{position:absolute;transform:translate(-50%,0);font-size:13px;font-weight:600;text-align:center;white-space:nowrap;background:#eeede8dc;padding:4px 8px;border-radius:3px}
    footer{height:58px;display:flex;align-items:center;justify-content:center;gap:28px;border-top:1px solid #b6b9bc;background:#f0eeea;font-size:13px}
    .key{display:flex;gap:7px;align-items:center}.swatch{width:13px;height:13px;border-radius:2px}
    @media(max-width:720px){header{height:120px;display:block;padding:12px}h1{font-size:18px}nav{margin-top:10px}main{height:calc(100vh - 186px)}footer{height:66px;gap:10px;flex-wrap:wrap;padding:8px}.role{font-size:10px}}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header>
    <div><h1>坐天观井 · Mini 修士家族</h1><p>共享身体 · 模块组合 · 统一比例</p></div>
    <nav aria-label="角色规模">
      <button data-count="6" aria-pressed="true">近景 · 6 人</button>
      <button data-count="20" aria-pressed="false">中景 · 20 人</button>
      <button data-count="50" aria-pressed="false">远景 · 50 人</button>
      <button data-count="300" aria-pressed="false">300 人压力测试</button>
    </nav>
  </header>
  <main><canvas id="characters" aria-label="修士三维尺度预览"></canvas><div id="status">正在加载角色资产…</div><div id="labels"></div></main>
  <footer>
    <span class="key"><i class="swatch" style="background:#eee7db"></i>普通修士</span>
    <span class="key"><i class="swatch" style="background:#486f91"></i>宗门弟子</span>
    <span class="key"><i class="swatch" style="background:#a1896d"></i>游修</span>
    <span class="key"><i class="swatch" style="background:#8693a4"></i>高阶修士 / 长老</span>
    <span class="key"><i class="swatch" style="background:#343339"></i>鬼修</span>
    <span class="key"><i class="swatch" style="background:#d6ab56"></i>丹修</span>
  </footer>
  <script type="module" src="./src/inkbox/render3d/charactersLab.js"></script>
</body>
</html>
